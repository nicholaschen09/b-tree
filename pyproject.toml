[project]
name = "b-tree-visualizer"
version = "0.1.0"
description = "Interactive B-tree visualizer with step-by-step operations"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.5.0",
    "ipywidgets>=7.6.0",
    "numpy>=1.21.0",
    "jupyter>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/b_tree_visualizer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
